    <path d="M570 402 C636 363 700 358 762 386" fill="none" stroke="#e8f7ff" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
  </g>
  <rect x="42" y="42" width="172" height="42" rx="21" fill="#ffffff" opacity="0.84"/>
  <text x="68" y="70" fill="#123b1f" font-family="Arial, sans-serif" font-size="18" font-weight="700">Pump Selection</text>
</svg>
