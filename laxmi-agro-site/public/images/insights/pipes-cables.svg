  <rect x="42" y="42" width="184" height="42" rx="21" fill="#ffffff" opacity="0.88"/>
  <text x="68" y="70" fill="#123b1f" font-family="Arial, sans-serif" font-size="18" font-weight="700">Pipes &amp; Cables</text>
