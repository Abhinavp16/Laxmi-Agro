      <rect x="23" y="22" width="70" height="72" rx="10" fill="#17351d"/>
      <circle cx="44" cy="46" r="8" fill="#ffb14a"/>
      <circle cx="73" cy="46" r="8" fill="#40b66b"/>
      <rect x="35" y="66" width="46" height="8" rx="4" fill="#dfe8d3"/>
