<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">Pipes and cable buying guide</title>
  <desc id="desc">Illustration showing PVC column pipes, GI pipes, submersible cable, and fittings for farm pump installation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f3f8ee"/>
      <stop offset="1" stop-color="#dfe8d3"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dce4ea"/>
      <stop offset="0.45" stop-color="#7c8d99"/>
      <stop offset="1" stop-color="#f6f9fb"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffb14a"/>
      <stop offset="1" stop-color="#e87518"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b2716" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="560" rx="42" fill="url(#bg)"/>
  <circle cx="110" cy="105" r="78" fill="#fff7df"/>
  <circle cx="688" cy="460" r="124" fill="#c8ddba" opacity="0.55"/>
  <g filter="url(#shadow)">
    <rect x="78" y="328" width="646" height="104" rx="34" fill="#ffffff" opacity="0.78"/>
    <g transform="translate(96 358)">
      <rect width="248" height="32" rx="16" fill="url(#steel)"/>
      <rect y="42" width="300" height="32" rx="16" fill="url(#steel)"/>
      <rect y="84" width="218" height="32" rx="16" fill="url(#steel)"/>
      <line x1="30" y1="16" x2="232" y2="16" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
      <line x1="35" y1="58" x2="278" y2="58" stroke="#ffffff" stroke-width="4" opacity="0.7"/>
    </g>
    <g transform="translate(402 294)">
      <rect x="0" y="0" width="238" height="70" rx="22" fill="#f7f9fb" stroke="#d5dde3" stroke-width="4"/>
      <rect x="24" y="20" width="190" height="30" rx="15" fill="#e7eef3"/>
      <path d="M46 86 C86 28 164 30 206 86" fill="none" stroke="#17351d" stroke-width="20" stroke-linecap="round"/>
      <path d="M44 86 C90 58 164 58 208 86" fill="none" stroke="url(#orange)" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g transform="translate(160 160)">
